spring.application.name=inventario

#Configurar conexion a db
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_pc?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=${DB_MYSQL_PASSWORD}



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Auth por sesiones (sin JWT)

# Mensajes de error legibles para el frontend (400 con "message")
server.error.include-message=always
server.error.include-binding-errors=always



logging.level.org.springframework.security=DEBUG
logging.level.com.sistema.inventario=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.root=INFO

# Formato en consola
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%thread]){cyan} %clr(%logger{36}){yellow} - %msg%n

spring.output.ansi.enabled=ALWAYS
