spring.application.name=inventario

#Configurar conexion a db
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_pc?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=${DB_MYSQL_PASSWORD}



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Auth por JWT (stateless: sin sesion, sin JSESSIONID)
# app.jwt.secret es la llave con la que se firman los tokens (HMAC-SHA256).
# Tiene que medir 32 caracteres o mas. Este valor es de uso LOCAL: si el proyecto
# llega a produccion, se mueve a una variable de entorno.
app.jwt.secret=9f2c7d41b8e35a6f0c4d19b7e2a85f63d0c97b41e6a2f58d3c07b9e14a6d82f35
# Vigencia del token: 86400000 ms = 24 horas.
app.jwt.expiration-ms=86400000

# Mensajes de error legibles para el frontend (400 con "message")
server.error.include-message=always
server.error.include-binding-errors=always



logging.level.org.springframework.security=DEBUG
logging.level.com.sistema.inventario=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.root=INFO

# Formato en consola
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%thread]){cyan} %clr(%logger{36}){yellow} - %msg%n

spring.output.ansi.enabled=ALWAYS
